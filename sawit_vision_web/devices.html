<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Devices — SawitVision</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 min-h-screen">
  <div id="nav"></div>

  <main class="max-w-4xl mx-auto p-4 space-y-6">
    <div class="bg-white p-4 rounded-xl shadow-sm">
      <h2 class="text-sm font-semibold text-slate-700 mb-1">Kode Kebun/Perusahaan</h2>
      <p class="text-xs text-slate-500 mb-2">
        Bagikan kode ini ke karyawan lapangan untuk didaftarkan di layar Pengaturan aplikasi
        mobile SawitVision (bagian "Sinkronisasi Cloud").
      </p>
      <div class="inline-block bg-emerald-50 border border-emerald-200 text-emerald-800 font-mono text-lg px-4 py-2 rounded-lg">
        <span id="companyKode">memuat...</span>
      </div>
    </div>

    <div class="bg-white p-4 rounded-xl shadow-sm overflow-x-auto">
      <h2 class="text-sm font-semibold text-slate-700 mb-3">Daftar Device Terdaftar</h2>
      <table class="w-full text-sm">
        <thead>
          <tr class="text-left text-slate-500 border-b">
            <th class="py-2 pr-3">Nama Karyawan</th>
            <th class="py-2 pr-3">Nama Device</th>
            <th class="py-2 pr-3">Terdaftar Sejak</th>
            <th class="py-2 pr-3">Sync Terakhir</th>
            <th class="py-2 pr-3">Total Scan</th>
          </tr>
        </thead>
        <tbody id="deviceTableBody"></tbody>
      </table>
      <p id="emptyState" class="text-sm text-slate-400 py-6 text-center hidden">
        Belum ada device yang terdaftar.
      </p>
    </div>
  </main>

  <script src="assets/config.js"></script>
  <script src="assets/app-common.js"></script>
  <script>
    async function init() {
      const session = await requireAdminSession();
      const profile = await getAdminProfile(session.user.id);
      renderNav('devices');

      const { data: company } = await window.supabaseClient
        .from('companies')
        .select('kode, nama')
        .eq('id', profile.company_id)
        .single();
      document.getElementById('companyKode').textContent = company ? company.kode : '-';

      const { data: devices, error } = await window.supabaseClient
        .from('devices')
        .select('id, device_name, worker_name, created_at, last_sync_at')
        .eq('company_id', profile.company_id)
        .order('created_at', { ascending: false });

      if (error) {
        alert('Gagal memuat devices: ' + error.message);
        return;
      }

      const { data: scanCounts } = await window.supabaseClient
        .from('scan_results')
        .select('device_id')
        .eq('company_id', profile.company_id);

      const countByDevice = {};
      (scanCounts || []).forEach((s) => {
        countByDevice[s.device_id] = (countByDevice[s.device_id] || 0) + 1;
      });

      const body = document.getElementById('deviceTableBody');
      const empty = document.getElementById('emptyState');

      if (!devices || devices.length === 0) {
        empty.classList.remove('hidden');
        return;
      }

      body.innerHTML = devices
        .map(
          (d) => `
        <tr class="border-b last:border-0">
          <td class="py-2 pr-3">${d.worker_name || '-'}</td>
          <td class="py-2 pr-3">${d.device_name || '-'}</td>
          <td class="py-2 pr-3">${formatDateTime(d.created_at)}</td>
          <td class="py-2 pr-3">${formatDateTime(d.last_sync_at)}</td>
          <td class="py-2 pr-3">${countByDevice[d.id] || 0}</td>
        </tr>`
        )
        .join('');
    }

    init().catch((e) => console.error(e));
  </script>
</body>
</html>
