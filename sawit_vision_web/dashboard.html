<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — SawitVision</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body class="bg-slate-50 min-h-screen">
  <div id="nav"></div>

  <main class="max-w-6xl mx-auto p-4 space-y-6">
    <div class="flex flex-wrap items-end gap-3 bg-white p-4 rounded-xl shadow-sm">
      <div>
        <label class="text-xs font-medium text-slate-600">Dari Tanggal</label>
        <input type="date" id="filterStart" class="block border rounded-lg px-3 py-1.5 text-sm" />
      </div>
      <div>
        <label class="text-xs font-medium text-slate-600">Sampai Tanggal</label>
        <input type="date" id="filterEnd" class="block border rounded-lg px-3 py-1.5 text-sm" />
      </div>
      <div>
        <label class="text-xs font-medium text-slate-600">Blok</label>
        <select id="filterBlok" class="block border rounded-lg px-3 py-1.5 text-sm min-w-[140px]">
          <option value="">Semua Blok</option>
        </select>
      </div>
      <button id="applyFilter" class="bg-emerald-700 text-white text-sm rounded-lg px-4 py-1.5">
        Terapkan
      </button>
      <button id="exportCsv" class="ml-auto border border-emerald-700 text-emerald-800 text-sm rounded-lg px-4 py-1.5">
        Ekspor CSV
      </button>
    </div>

    <div id="statCards" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div>

    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white p-4 rounded-xl shadow-sm">
        <h2 class="text-sm font-semibold text-slate-700 mb-2">Jumlah Janjang per Hari</h2>
        <canvas id="chartJanjang" height="220"></canvas>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm">
        <h2 class="text-sm font-semibold text-slate-700 mb-2">Distribusi Fraksi Kematangan</h2>
        <canvas id="chartFraksi" height="220"></canvas>
      </div>
    </div>

    <div class="bg-white p-4 rounded-xl shadow-sm overflow-x-auto">
      <h2 class="text-sm font-semibold text-slate-700 mb-3">Riwayat Scan Terbaru</h2>
      <table class="w-full text-sm">
        <thead>
          <tr class="text-left text-slate-500 border-b">
            <th class="py-2 pr-3">Tanggal</th>
            <th class="py-2 pr-3">Mode</th>
            <th class="py-2 pr-3">Blok</th>
            <th class="py-2 pr-3">Janjang</th>
            <th class="py-2 pr-3">Brondol</th>
            <th class="py-2 pr-3">Fraksi</th>
            <th class="py-2 pr-3">Device</th>
          </tr>
        </thead>
        <tbody id="scanTableBody"></tbody>
      </table>
      <p id="emptyState" class="text-sm text-slate-400 py-6 text-center hidden">Belum ada data scan.</p>
    </div>
  </main>

  <script src="assets/config.js"></script>
  <script src="assets/app-common.js"></script>
  <script>
    let allScans = [];
    let deviceNameMap = {};
    let janjangChart, fraksiChart;

    async function loadData() {
      const session = await requireAdminSession();
      const profile = await getAdminProfile(session.user.id);

      renderNav('dashboard');

      // Isi default filter tanggal: 30 hari terakhir.
      const end = new Date();
      const start = new Date();
      start.setDate(start.getDate() - 29);
      document.getElementById('filterEnd').value = end.toISOString().slice(0, 10);
      document.getElementById('filterStart').value = start.toISOString().slice(0, 10);

      const { data: devices } = await window.supabaseClient
        .from('devices')
        .select('id, device_name, worker_name')
        .eq('company_id', profile.company_id);
      (devices || []).forEach((d) => {
        deviceNameMap[d.id] = d.worker_name || d.device_name || d.id.slice(0, 8);
      });

      await refresh();
    }

    async function refresh() {
      const start = document.getElementById('filterStart').value;
      const end = document.getElementById('filterEnd').value;
      const blok = document.getElementById('filterBlok').value;

      let query = window.supabaseClient
        .from('scan_results')
        .select('*')
        .order('captured_at', { ascending: false })
        .limit(1000);

      if (start) query = query.gte('captured_at', start + 'T00:00:00');
      if (end) query = query.lte('captured_at', end + 'T23:59:59');
      if (blok) query = query.eq('blok', blok);

      const { data, error } = await query;
      if (error) {
        alert('Gagal memuat data: ' + error.message);
        return;
      }
      allScans = data || [];

      populateBlokOptions(allScans);
      renderStatCards(allScans);
      renderCharts(allScans);
      renderTable(allScans);
    }

    function populateBlokOptions(scans) {
      const select = document.getElementById('filterBlok');
      const current = select.value;
      const bloks = Array.from(new Set(scans.map((s) => s.blok).filter(Boolean))).sort();
      select.innerHTML =
        '<option value="">Semua Blok</option>' +
        bloks.map((b) => `<option value="${b}">${b}</option>`).join('');
      select.value = current;
    }

    function renderStatCards(scans) {
      const totalJanjang = scans
        .filter((s) => s.mode === 'janjang')
        .reduce((sum, s) => sum + (s.jumlah_janjang || 0), 0);
      const totalBrondolScans = scans.filter((s) => s.mode === 'brondol').length;
      const idealCount = scans.filter((s) => FRAKSI_IDEAL.has(s.fraksi)).length;

      const cards = [
        { label: 'Total Scan', value: scans.length, color: 'text-slate-700' },
        { label: 'Total Janjang', value: totalJanjang, color: 'text-emerald-700' },
        { label: 'Scan Brondol', value: totalBrondolScans, color: 'text-orange-700' },
        { label: 'Kondisi Ideal', value: idealCount, color: 'text-green-700' },
      ];

      document.getElementById('statCards').innerHTML = cards
        .map(
          (c) => `
        <div class="bg-white rounded-xl shadow-sm p-4">
          <div class="text-2xl font-bold ${c.color}">${c.value}</div>
          <div class="text-xs text-slate-500 mt-1">${c.label}</div>
        </div>`
        )
        .join('');
    }

    function renderCharts(scans) {
      const perHari = {};
      scans
        .filter((s) => s.mode === 'janjang')
        .forEach((s) => {
          const day = s.captured_at.slice(0, 10);
          perHari[day] = (perHari[day] || 0) + (s.jumlah_janjang || 0);
        });
      const days = Object.keys(perHari).sort();

      const fraksiCount = {};
      scans
        .filter((s) => s.mode === 'brondol')
        .forEach((s) => {
          fraksiCount[s.fraksi] = (fraksiCount[s.fraksi] || 0) + 1;
        });

      if (janjangChart) janjangChart.destroy();
      janjangChart = new Chart(document.getElementById('chartJanjang'), {
        type: 'bar',
        data: {
          labels: days,
          datasets: [{ label: 'Janjang', data: days.map((d) => perHari[d]), backgroundColor: '#2E7D32' }],
        },
        options: { plugins: { legend: { display: false } } },
      });

      if (fraksiChart) fraksiChart.destroy();
      const fraksiKeys = Object.keys(fraksiCount);
      fraksiChart = new Chart(document.getElementById('chartFraksi'), {
        type: 'pie',
        data: {
          labels: fraksiKeys.map((k) => FRAKSI_LABEL[k] || k),
          datasets: [
            {
              data: fraksiKeys.map((k) => fraksiCount[k]),
              backgroundColor: fraksiKeys.map((k) => fraksiColor(k)),
            },
          ],
        },
      });
    }

    function renderTable(scans) {
      const body = document.getElementById('scanTableBody');
      const empty = document.getElementById('emptyState');
      const rows = scans.slice(0, 100);

      if (rows.length === 0) {
        body.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      body.innerHTML = rows
        .map(
          (s) => `
        <tr class="border-b last:border-0">
          <td class="py-2 pr-3">${formatDateTime(s.captured_at)}</td>
          <td class="py-2 pr-3 capitalize">${s.mode}</td>
          <td class="py-2 pr-3">${s.blok || '-'}</td>
          <td class="py-2 pr-3">${s.mode === 'janjang' ? s.jumlah_janjang : '-'}</td>
          <td class="py-2 pr-3">${s.mode === 'brondol' ? s.estimasi_brondol : '-'}</td>
          <td class="py-2 pr-3">${s.mode === 'brondol' ? (FRAKSI_LABEL[s.fraksi] || s.fraksi) : '-'}</td>
          <td class="py-2 pr-3">${deviceNameMap[s.device_id] || s.device_id.slice(0, 8)}</td>
        </tr>`
        )
        .join('');
    }

    document.getElementById('applyFilter').addEventListener('click', refresh);

    document.getElementById('exportCsv').addEventListener('click', () => {
      const csv = toCsv(allScans, [
        { label: 'Tanggal', get: (s) => formatDateTime(s.captured_at) },
        { label: 'Mode', get: (s) => s.mode },
        { label: 'Blok', get: (s) => s.blok },
        { label: 'Jumlah Janjang', get: (s) => s.jumlah_janjang },
        { label: 'Estimasi Brondol', get: (s) => s.estimasi_brondol },
        { label: 'Ukuran Janjang', get: (s) => s.ukuran_janjang },
        { label: 'Persen Brondol', get: (s) => s.persen_brondol },
        { label: 'Fraksi', get: (s) => FRAKSI_LABEL[s.fraksi] || s.fraksi },
        { label: 'Catatan', get: (s) => s.catatan },
        { label: 'Device', get: (s) => deviceNameMap[s.device_id] || s.device_id },
      ]);
      downloadTextFile(`sawit_vision_scan_${Date.now()}.csv`, csv);
    });

    loadData().catch((e) => console.error(e));
  </script>
</body>
</html>
