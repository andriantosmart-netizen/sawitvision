name: sawit_vision
description: >
  SawitVision — Deteksi & hitung janjang (TBS) serta taksasi brondol kelapa
  sawit secara offline langsung dari kamera HP.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Kamera & gambar
  camera: ^0.10.6
  image_picker: ^1.1.2
  image: ^4.2.0

  # Penyimpanan lokal (offline-first)
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.2.3

  # Mesin inferensi untuk mode "Model Custom (TFLite)" -- lihat
  # lib/services/tflite_detection_service.dart.
  #
  # RIWAYAT: sempat DILEPAS di versi sebelumnya karena versi lama paket ini
  # (native TensorFlow Lite yang dibawanya bentrok "namespace" di Android
  # Gradle Plugin terbaru -- error: "Namespace 'org.tensorflow.lite' is used
  # in multiple modules") dan karena belum ada model .tflite hasil training.
  # Sekarang dipasang lagi (2026-08-03) karena kedua alasan itu sudah tidak
  # berlaku: (1) sudah ada model hasil training di assets/models/, (2) rilis
  # 0.12.0 (Okt 2025) paket ini "memodernisasi" build Android-nya ke AGP 8.6.1
  # dengan Gradle plugins DSL baru -- perbaikan inilah yang menghilangkan
  # konflik namespace tadi. Paket ini sekarang dipublikasikan resmi oleh
  # publisher terverifikasi tensorflow.org (repo github.com/tensorflow/flutter-tflite).
  # CATATAN: belum sempat di-build/dites langsung di sesi ini (tidak ada
  # SDK Flutter di lingkungan kerja Claude) -- kalau build Codemagic masih
  # gagal karena isu serupa, laporkan pesan errornya untuk diperbaiki lagi.
  tflite_flutter: ^0.12.1

  # Grafik ringkas di Stats screen
  fl_chart: ^0.68.0

  # Export & share data
  csv: ^6.0.0
  share_plus: ^9.0.0

  # Permission (kamera, storage)
  permission_handler: ^11.3.1

  # Sinkronisasi ke web dashboard (opsional — app tetap 100% jalan offline
  # tanpa ini, lihat lib/services/sync_service.dart)
  supabase_flutter: ^2.5.6
  connectivity_plus: ^6.0.3

  # Util
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/labels/
